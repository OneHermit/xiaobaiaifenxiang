<style>#courseNav{background:#2c3e50;color:#fff;position:sticky;top:0;z-index:1000;box-shadow:0 2px 6px rgba(0,0,0,0.15);}#courseNav .course-nav-inner{max-width:1500px;margin:0 auto;padding:0 20px;display:flex;align-items:center;min-height:56px;gap:24px;flex-wrap:wrap;}#courseNav .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-size:20px;font-weight:700;letter-spacing:0.5px;white-space:nowrap;}#courseNav .nav-logo img{width:32px;height:32px;border-radius:6px;object-fit:cover;background-color:#fff;}#courseNav .nav-links{list-style:none;padding:0;margin:0;display:flex;flex:1;flex-wrap:wrap;gap:4px;align-items:center;justify-content:flex-end;}#courseNav .nav-links li{margin:0;}#courseNav .nav-links a{display:block;padding:10px 16px;color:#d0d8e0;text-decoration:none;font-size:14px;border-radius:6px;transition:all 0.18s ease;white-space:nowrap;}#courseNav .nav-links a:hover{background:rgba(255,255,255,0.1);color:#fff;}#courseNav .nav-links a.active{background:#3498db;color:#fff;font-weight:600;}#courseNav .nav-back{color:#d0d8e0;text-decoration:none;font-size:13px;padding:8px 14px;border:1px solid rgba(255,255,255,0.2);border-radius:6px;transition:all 0.18s ease;white-space:nowrap;}#courseNav .nav-back:hover{background:rgba(255,255,255,0.1);color:#fff;border-color:rgba(255,255,255,0.35);}#courseNav .nav-empty{color:rgba(255,255,255,0.5);font-size:13px;padding:0 8px;}#courseNav .nav-loading{color:rgba(255,255,255,0.6);font-size:13px;padding:0 8px;}@media (max-width:768px){#courseNav .course-nav-inner{gap:12px;padding:10px 16px;}#courseNav .nav-logo{font-size:18px;}#courseNav .nav-links{width:100%;gap:2px;}#courseNav .nav-links a{padding:8px 12px;font-size:13px;}#courseNav .nav-back{padding:6px 10px;font-size:12px;}}</style><nav id="courseNav"><div class="course-nav-inner"><a href="./index.html" class="nav-logo"><img src="../image/logo.png" alt="Logo" onerror="this.style.display='none'"><span>知未教程</span></a><ul class="nav-links" id="courseNavLinks"><li class="nav-loading">加载中...</li></ul><a href="../index.html" class="nav-back">← 小白爱分享</a></div></nav><script>(function(){'use strict';async function loadCourseRoot(baseUrl){try{const resp = await fetch(baseUrl + 'courseRoot.js');if(!resp.ok)return [];const text = await resp.text();const decl = 'const courseRoot';const start = text.indexOf(decl);if(start === -1)return [];const eqIdx = text.indexOf('=',start);if(eqIdx === -1)return [];let valueStr = text.slice(eqIdx + 1).trim();if(valueStr.endsWith(';'))valueStr = valueStr.slice(0,-1).trim();const arr = JSON.parse(valueStr);return Array.isArray(arr)? arr:[];}catch(e){console.warn('[courseNav] 读取 courseRoot.js 失败:',e);return [];}}window.renderCourseNav = async function(containerId,options){options = options ||{};const baseUrl = options.baseUrl || './';const replaceTarget = options.replaceTarget !== false;const container = document.getElementById(containerId);if(!container){console.warn('[courseNav] 找不到容器:',containerId);return;}const courseNav = document.getElementById('courseNav');if(!courseNav){try{const htmlResp = await fetch(baseUrl + 'nav.html');if(htmlResp.ok){const htmlText = await htmlResp.text();const styleMatch = htmlText.match(/<style>([\s\S]*?)<\/style>/);if(styleMatch && !document.querySelector('#courseNav')){const styleEl = document.createElement('style');styleEl.textContent = styleMatch[1];document.head.appendChild(styleEl);}const navMatch = htmlText.match(/(<nav\s+id="courseNav"[\s\S]*?<\/nav>)/);if(navMatch){const wrapper = document.createElement('div');wrapper.innerHTML = navMatch[1];const navEl = wrapper.firstElementChild;if(replaceTarget){if(container.parentNode){container.parentNode.replaceChild(navEl,container);}}else{container.innerHTML = '';container.appendChild(navEl);}}}}catch(e){console.warn('[courseNav] 注入导航片段失败:',e);container.innerHTML = '<nav id="courseNav"><div class="course-nav-inner"><span class="nav-logo">知未教程</span></div></nav>';}}const courses = await loadCourseRoot(baseUrl);const ul = document.getElementById('courseNavLinks');if(!ul)return;ul.innerHTML = '';if(!courses || courses.length === 0){const li = document.createElement('li');li.className = 'nav-empty';li.textContent = '暂无教程';ul.appendChild(li);return;}courses.sort((a,b)=>(a.order || 0)-(b.order || 0));courses.forEach(c =>{const li = document.createElement('li');const a = document.createElement('a');a.href = '#';a.textContent = c.name;a.dataset.courseName = c.name;if(options.activeCourse && options.activeCourse === c.name){a.classList.add('active');}a.addEventListener('click',(ev)=>{ev.preventDefault();ul.querySelectorAll('a').forEach(x => x.classList.remove('active'));a.classList.add('active');if(typeof options.onSelect === 'function'){options.onSelect(c.name);}});li.appendChild(a);ul.appendChild(li);});window.setCourseNavActive = function(courseName){const navUl = document.getElementById('courseNavLinks');if(!navUl)return;navUl.querySelectorAll('a').forEach(a =>{a.classList.toggle('active',a.dataset.courseName === courseName);});};};})();</script>
