靖瑶','婉婷','茹雪','美琳','欢馨','优璇','雨嘉','明美','可馨','惠茜','漫妮','香茹','月婵','嫦曦','静香','雅芙','妙菡','书瑶','念薇','寻雁','映寒','伟宸','鸿煊','博涛','烨霖','煜祺','智宸','正豪','昊然','志泽','明杰','立诚','立轩','立辉','峻熙','弘文','熠彤','鸿涛','烨伟','苑博','伟泽','哲瀚','雨泽','楷瑞','建辉','晋鹏','天磊','绍辉','泽洋','鑫磊','鹏煊','昊强','博超','君浩','子骞','明轩','健柏','修杰','炎彬','鹤轩','越彬' ];const DEFAULT_WALL = DEFAULT_NAMES.map(function(nm,i){return{name:nm,blessing:BLESSINGS[i % BLESSINGS.length]};});const LS_KEY = 'guoqing_bless_wall_v1';let wall = DEFAULT_WALL.slice();try{const saved = JSON.parse(localStorage.getItem(LS_KEY)|| '[]');if(Array.isArray(saved)){saved.forEach(it =>{if(it && typeof it.name === 'string' && typeof it.blessing === 'string'){wall.push({name:it.name.slice(0,6),blessing:it.blessing,user:true});}});}}catch(e){}function persistWall(){try{localStorage.setItem(LS_KEY,JSON.stringify(wall.slice(DEFAULT_WALL.length).slice(-40)));}catch(e){}}function addToWall(item){if(wall.some(w => w.name === item.name && w.blessing === item.blessing))return false;item.user = true;wall.push(item);persistWall();return true;}let W = 0,H = 0;let particles = [];let flagPoints = [];let mode = 'flag';let currentName = '';let blessIdx = 0;const mouse ={x:-9999,y:-9999};const N = 9000;const SIZE = 1.8;const INNER = Math.sin(Math.PI / 10)/ Math.sin(Math.PI * 3 / 10);function starVertices(cx,cy,R,rot){const inner = R * INNER,pts = [];for(let i = 0;i < 10;i++){const r =(i % 2)? inner:R;const a = rot + i * Math.PI / 5;pts.push([cx + Math.cos(a)* r,cy + Math.sin(a)* r]);}return pts;}function inPoly(px,py,poly){let inside = false;for(let i = 0,j = poly.length - 1;i < poly.length;j = i++){const xi = poly[i][0],yi = poly[i][1];const xj = poly[j][0],yj = poly[j][1];if(((yi > py)!==(yj > py))&&(px <(xj - xi)*(py - yi)/(yj - yi)+ xi))inside = !inside;}return inside;}function buildFlagPoints(){let fw = W * 0.68,fh = fw * 2 / 3;if(fh > H * 0.58){fh = H * 0.58;fw = fh * 1.5;}const fx =(W - fw)/ 2,fy =(H - fh)/ 2;const bigCX = fx + fw * 5 / 30,bigCY = fy + fh * 5 / 20;const defs = [{cx:bigCX,cy:bigCY,R:fw * 3 / 30,rot:-Math.PI / 2}];[[10/30,2/20],[12/30,4/20],[12/30,7/20],[10/30,9/20]].forEach(([u,v])=>{const cx = fx + fw * u,cy = fy + fh * v;defs.push({cx,cy,R:fw / 30,rot:Math.atan2(bigCY - cy,bigCX - cx)});});const polys = defs.map(s => starVertices(s.cx,s.cy,s.R,s.rot));const step = fw * 0.0062;const starArr = [],redArr = [];const jitter = step * 0.42;for(let y = fy;y <= fy + fh;y += step){for(let x = fx;x <= fx + fw;x += step){const px = x +(Math.random()- 0.5)* jitter;const py = y +(Math.random()- 0.5)* jitter;let isStar = false;for(let i = 0;i < polys.length;i++){if(inPoly(px,py,polys[i])){isStar = true;break;}}if(isStar){const v = 0.90 + Math.random()* 0.18;starArr.push({x:px,y:py,c:[255 * v,222 * v,26 * v]});}else{const v = 0.82 + Math.random()* 0.32;redArr.push({x:px,y:py,c:[222 * v,41 * v,16 * v]});}}}const redNeed = Math.max(0,N - starArr.length);let redOut;if(redArr.length <= redNeed){redOut = redArr;}else{redOut = [];const stride = redArr.length / redNeed;for(let i = 0;i < redNeed;i++){redOut.push(redArr[Math.floor(i * stride)]);}}return starArr.concat(redOut);}const TEXT_PALETTE = [ [255,215,90],[255,180,70],[255,145,80],[255,245,185],[255,110,95] ];function buildTextPoints(name,blessing){const oc = document.createElement('canvas');oc.width = W;oc.height = H;const g = oc.getContext('2d');g.fillStyle = '#fff';g.textAlign = 'center';g.textBaseline = 'middle';const M = 100;const FONT_FAMILY = '"PingFang SC","Microsoft YaHei",sans-serif';g.font = 'bold ' + M + 'px ' + FONT_FAMILY;const nameW =(g.measureText(name).width || 1)/ M;const blessW =(g.measureText(blessing).width || 1)/ M;const maxWidth = W * 0.88;let nameSize = Math.min(maxWidth / nameW,H * 0.24);nameSize = Math.max(nameSize,32);let blessSize = Math.min(nameSize * 0.68,maxWidth / blessW);blessSize = Math.max(blessSize,20);const gap = Math.max(nameSize * 0.34,14);const totalH = nameSize + gap + blessSize;const startY = H / 2 - totalH / 2;g.font = 'bold ' + nameSize + 'px ' + FONT_FAMILY;g.fillText(name,W / 2,startY + nameSize / 2);g.font = 'bold ' + blessSize + 'px ' + FONT_FAMILY;g.fillText(blessing,W / 2,startY + nameSize + gap + blessSize / 2);const data = g.getImageData(0,0,W,H).data;const pts = [];const step = Math.max(2,Math.round(2.0 * dpr));for(let y = 0;y < H;y += step){for(let x = 0;x < W;x += step){if(data[(y * W + x)* 4 + 3] > 128){pts.push({x,y});}}}return pts;}function resample(pts,count,jitter){if(pts.length === 0)return [];if(pts.length >= count){const out = [];const stride = pts.length / count;for(let i = 0;i < count;i++)out.push(pts[Math.floor(i * stride)]);return out;}const out = pts.slice();while(out.length < count){const b = pts[(Math.random()* pts.length)| 0];out.push({x:b.x +(Math.random()- 0.5)* jitter,y:b.y +(Math.random()- 0.5)* jitter});}return out;}function assignScatter(){for(let i = 0;i < particles.length;i++){const p = particles[i];p.wx = Math.random()* W;p.wy = Math.random()* H;const v = 0.35 + Math.random()* 0.5;if(Math.random()< 0.5){p.wr = 210 * v;p.wg = 70 * v;p.wb = 35 * v;}else{p.wr = 225 * v;p.wg = 175 * v;p.wb = 75 * v;}}}function build(oldW,oldH){if(!W || !H)return;flagPoints = buildFlagPoints();particles = flagPoints.map(fp =>({x:fp.x +(Math.random()- 0.5)* W * 0.8,y:fp.y +(Math.random()- 0.5)* H * 0.8,vx:0,vy:0,fx:fp.x,fy:fp.y,fr:fp.c[0],fg:fp.c[1],fb:fp.c[2],tx:fp.x,ty:fp.y,tr:fp.c[0],tg:fp.c[1],tb:fp.c[2],wx:Math.random()* W,wy:Math.random()* H,wr:120,wg:50,wb:30,r:60,g:60,b:60,a:0}));if(mode === 'text' && currentName){applyText(currentName,BLESSINGS[blessIdx],true);}if(mode === 'wall'){assignScatter();if(oldW && oldH){wallItems.forEach(it =>{it.x *= W / oldW;it.y *= H / oldH;});}}}function applyText(name,blessing,silent){let tp = buildTextPoints(name,blessing);tp = resample(tp,particles.length,5 * dpr);tp.forEach(p =>{p.c = TEXT_PALETTE[(Math.random()* TEXT_PALETTE.length)| 0];});particles.forEach((p,i)=>{const t = tp[i] || tp[tp.length - 1];p.tx = t.x;p.ty = t.y;p.tr = t.c[0];p.tg = t.c[1];p.tb = t.c[2];if(!silent){const ang = Math.random()* Math.PI * 2;const s = 4 + Math.random()* 8;p.vx += Math.cos(ang)* s;p.vy += Math.sin(ang)* s;}});}function applyFlag(){particles.forEach((p,i)=>{const f = flagPoints[i];if(!f)return;p.fx = f.x;p.fy = f.y;p.fr = f.c[0];p.fg = f.c[1];p.fb = f.c[2];const ang = Math.random()* Math.PI * 2;const s = 2.5 + Math.random()* 5.5;p.vx += Math.cos(ang)* s;p.vy += Math.sin(ang)* s;});}function resize(){const w = panel.clientWidth,h = panel.clientHeight;if(!w || !h)return;const oldW = W,oldH = H;W = w * dpr;H = h * dpr;cv.width = W;cv.height = H;cv.style.width = w + 'px';cv.style.height = h + 'px';build(oldW,oldH);}addResize(resize);let lastTs = performance.now();function loop(ts){requestAnimationFrame(loop);if(!panel.classList.contains('on')|| !W){if(ts)lastTs = ts;return;}const dt = ts ? Math.min(0.05,(ts - lastTs)/ 1000):0.016;lastTs = ts || performance.now();if(mode === 'wall'){wallTime += dt;if(wallPhase === 'float' && wallTime >= WALL_FLOAT){wallPhase = 'merge';applyFlag();}if(wallPhase === 'merge' && wallTime >= WALL_FLOAT + WALL_MERGE){backToFlag();}}ctx.fillStyle = 'rgba(4,6,12,0.32)';ctx.fillRect(0,0,W,H);const wallFloat = mode === 'wall' && wallPhase === 'float';const size = SIZE * dpr;const half = size / 2;for(let i = 0;i < particles.length;i++){const p = particles[i];let tx,ty,tr,tg,tb,ta;if(mode === 'text'){tx = p.tx;ty = p.ty;tr = p.tr;tg = p.tg;tb = p.tb;ta = 1;}else if(wallFloat){tx = p.wx;ty = p.wy;tr = p.wr;tg = p.wg;tb = p.wb;ta = 0.55;}else{tx = p.fx;ty = p.fy;tr = p.fr;tg = p.fg;tb = p.fb;ta = 1;}p.vx +=(tx - p.x)* 0.020;p.vy +=(ty - p.y)* 0.020;const dx = p.x - mouse.x;const dy = p.y - mouse.y;const d2 = dx * dx + dy * dy;if(d2 < 14000 && d2 > 0.01){const d = Math.sqrt(d2);const f =(118 - d)/ 118 * 3.2;p.vx += dx / d * f;p.vy += dy / d * f;}p.vx *= 0.87;p.vy *= 0.87;p.x += p.vx;p.y += p.vy;p.r +=(tr - p.r)* 0.10;p.g +=(tg - p.g)* 0.10;p.b +=(tb - p.b)* 0.10;p.a +=(ta - p.a)* 0.07;const alpha =
