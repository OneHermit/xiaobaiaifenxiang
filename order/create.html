<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>录入工单 - 工单系统</title><link rel="stylesheet" href="css/style.css" /></head><body><div class="topbar"><div class="title" id="pageTitle">录入工单</div><a href="home.html" style="color: #1a6bff; text-decoration: none; font-size: 14px">返回</a></div><div class="container"><div id="message"></div><div class="card"><form id="orderForm" autocomplete="off"><div class="form-item"><label for="name">名称</label><input id="name" name="name" type="text" placeholder="请输入名称" required /></div><div class="form-item"><label for="num">数量</label><input id="num" name="num" type="number" min="0" step="1" placeholder="请输入数量" required /></div><div class="form-item"><label for="unitPrice">单件费用</label><input id="unitPrice" name="unitPrice" type="number" min="0" step="0.01" placeholder="请输入单件费用" required /></div><button id="submitBtn" class="btn btn-primary btn-block" type="submit">保存</button></form></div></div><script src="https://cdn.jsdelivr.net/npm/axios@1.7.9/dist/axios.min.js"></script><script src="js/api.js"></script><script src="js/create.js"></script></body></html>
