            <section id="toolsContainer">

                <div id="json-format" class="tool-section">

                        <br>
                        <button class="page-btn" onclick="formatJSON()" style="margin-top: 10px;">格式化</button>
                        <textarea id="jsonOutput" placeholder="格式化后的JSON..."
                            style="width: 100%; height: 200px; margin-top: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"
                            readonly></textarea>
                    </div>
                </div>

                <div id="js-minify" class="tool-section">
                    <div class="article-card">
                        <h2>JS压缩工具</h2>
                        <textarea id="jsInput" placeholder="请输入JS代码..."
                            style="width: 100%; height: 150px; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"></textarea>
                        <br>
                        <button class="page-btn" onclick="minifyJS()" style="margin-top: 10px;">压缩</button>
                        <textarea id="jsOutput" placeholder="压缩后的JS..."
                            style="width: 100%; height: 150px; margin-top: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"
                            readonly></textarea>
                    </div>
                </div>

                <div id="css-minify" class="tool-section">
                    <div class="article-card">
                        <h2>CSS压缩工具</h2>

                            readonly></textarea>
                    </div>
                </div>

                <div id="base64-codec" class="tool-section">
                    <div class="article-card">
                        <h2>Base64编码/解码工具</h2>
                        <textarea id="base64Input" placeholder="请输入待处理的文本..."
                            style="width: 100%; height: 100px; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"></textarea>
                        <br>
                        <button class="page-btn" onclick="encodeBase64()" style="margin-top: 10px;">编码</button>
                        <button class="page-btn" onclick="decodeBase64()"
                            style="margin-top: 10px; margin-left: 10px;">解码</button>
                        <textarea id="base64Output" placeholder="处理后的结果..."
                            style="width: 100%; height: 100px; margin-top: 10px; padding: 10px; border: 1px solid #ddd; border-radius: 4px;"

                        <input type="text" id="asciiInput" placeholder="仅输入英文字母" 
                               style="padding: 10px 15px; font-size: 16px; width: 360px; border-radius: 6px; border: 1px solid #ddd; font-family: monospace;">
                        <button class="page-btn" onclick="generateAsciiArt()" style="margin-left: 8px;">生成</button>
                        <div style="margin-top: 20px;">预览：</div>
                        <pre id="asciiPreview" style="white-space: pre; font-family: monospace; font-size: 14px; background:#fff; color:#000; padding:10px; margin-top: 10px;"></pre>

    <script>
        // 页面加载完成后执行初始化
        document.addEventListener('DOMContentLoaded', function () {
            // 生成导航栏
            generateNavigation();

            // 生成页脚
            generateFooter();

            // 侧边栏切换逻辑
            const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');
            const sidebarOverlay = document.getElementById('sidebarOverlay');
            const sidebar = document.getElementById('sidebar');

            function toggleSidebar() {
                if (sidebar) {
                    sidebar.classList.toggle('active');
                }
                if (sidebarToggleBtn) {
                    sidebarToggleBtn.classList.toggle('active');
                }
                if (sidebarOverlay) {
                    sidebarOverlay.classList.toggle('active');
                }
            }

            if (sidebarToggleBtn) {
                sidebarToggleBtn.addEventListener('click', toggleSidebar);
            }

            if (sidebarOverlay) {
                sidebarOverlay.addEventListener('click', toggleSidebar);
            }

            // 点击导航项时关闭侧边栏（移动端）
            document.addEventListener('click', function(e) {
                if (e.target.closest('.sidebar-list li')) {
                    if (window.innerWidth <= 768) {
                        toggleSidebar();
                    }
                }
            });

            // 渲染工具页面专属侧边栏
            renderToolsSidebar();

            // 默认显示第一个工具
            if (typeof tools !== 'undefined' && tools.length > 0) {
                switchTool(tools[0].id);
            }
        });

        // 动态生成侧边栏结构和内容
        function renderToolsSidebar() {
            const sidebar = document.getElementById('sidebar');
            if (!sidebar) return;

            let sidebarHTML = '';

            // 工具列表部分
            if (typeof tools !== 'undefined') {
                sidebarHTML += `
                    <div class="sidebar-section">
                        <h3>工具列表</h3>
                        <ul class="sidebar-list" id="toolList">
                `;
                tools.forEach(tool => {
                    sidebarHTML += `
                        <li id="nav-${tool.id}">
                            <a href="javascript:void(0)" onclick="switchTool('${tool.id}')">${tool.icon} ${tool.name}</a>
                        </li>
                    `;
                });
                sidebarHTML += `
                        </ul>
                    </div>
                `;
            }

            // 友情链接部分
            if (typeof links !== 'undefined') {
                sidebarHTML += `
                    <div class="sidebar-section">
                        <h3>友情链接</h3>
                        <ul class="sidebar-list">
                `;
                links.forEach(link => {
                    sidebarHTML += `
                        <li>
                            <a href="${link.url}" target="_blank">${link.name}</a>
                        </li>
                    `;
                });
                sidebarHTML += `
                        </ul>
                    </div>
                `;
            }

            sidebar.innerHTML = sidebarHTML;
        }

        // 切换工具
        function switchTool(toolId) {
            // 切换内容显隐
            const sections = document.querySelectorAll('.tool-section');
            sections.forEach(section => {
                section.classList.remove('active');
            });
            const activeSection = document.getElementById(toolId);
            if (activeSection) {
                activeSection.classList.add('active');
            }

            // 切换导航激活状态
            const navItems = document.querySelectorAll('#toolList li');
            navItems.forEach(item => {
                item.classList.remove('active');
            });
            const activeNavItem = document.getElementById(`nav-${toolId}`);
            if (activeNavItem) {
                activeNavItem.classList.add('active');
            }

            // 更新标题
            const tool = tools.find(t => t.id === toolId);
            if (tool) {
                document.getElementById('toolTitle').textContent = tool.name;
                document.getElementById('toolDesc').textContent = `小白爱分享提供的实用${tool.name}工具`;
            }
        }

        // JSON格式化功能
        function formatJSON() {
            const input = document.getElementById('jsonInput').value;
            if (!input.trim()) return;
            try {
                const jsonObj = JSON.parse(input);
                const formatted = JSON.stringify(jsonObj, null, 4);
                document.getElementById('jsonOutput').value = formatted;
            } catch (e) {
                alert('JSON格式错误: ' + e.message);
            }
        }

        // JS压缩功能
        function minifyJS() {
            const input = document.getElementById('jsInput').value;
            if (!input.trim()) return;
            // 简单的JS压缩模拟 (移除注释和空白)
            const minified = input
                .replace(/\/\*[\s\S]*?\*\/|([^:]|^)\/\/.*$/gm, '$1') // 移除注释
                .replace(/\s+/g, ' ') // 压缩空白
                .replace(/([\{\}\(\)\[\]\+\-\*\/=><!&\|;,:])\s+/g, '$1') // 移除符号后的空格
                .replace(/\s+([\{\}\(\)\[\]\+\-\*\/=><!&\|;,:])/g, '$1') // 移除符号前的空格
                .trim();
            document.getElementById('jsOutput').value = minified;
        }

        // CSS压缩功能
        function minifyCSS() {
            const input = document.getElementById('cssInput').value;
            if (!input.trim()) return;
            const minified = input
                .replace(/\s+/g, ' ')           // 多个空白字符替换为单个空格
                .replace(/\/\*(.*?)\*\//g, '')  // 移除注释
                .replace(/\s*([{}:;,])\s*/g, '$1') // 移除选择器周围的空格
                .trim();
            document.getElementById('cssOutput').value = minified;
        }

        // Base64编码
        function encodeBase64() {
            const input = document.getElementById('base64Input').value;
            if (!input.trim()) return;
            try {
                const encoded = btoa(unescape(encodeURIComponent(input)));
                document.getElementById('base64Output').value = encoded;
            } catch (e) {
                alert('编码错误: ' + e.message);
            }
        }

        // Base64解码
        function decodeBase64() {
            const input = document.getElementById('base64Input').value;
            if (!input.trim()) return;
            try {
                const decoded = decodeURIComponent(escape(atob(input)));
                document.getElementById('base64Output').value = decoded;
            } catch (e) {
                alert('Base64解码错误: ' + e.message);
            }
        }

        // 将普通空格替换成等宽空白符 ░，让宽度和█完全一致
        function fixSpace(str) {
            return str.replace(/ /g, '░');
        }

        // ASCII艺术字生成函数
        function generateAsciiArt() {
            const rawText = document.getElementById('asciiInput').value.trim().toUpperCase();
            if (!rawText) { 
                alert('请输入英文字母！'); 
                return; 
            }
            const text = [...rawText].filter(c => /[A-Z]/.test(c));
            
            let outputLines = ['', '', '', '', '', ''];
            for (let char of text) {
                const charLines = blockFont[char];
                if (charLines) {
                    for (let i = 0; i < 6; i++) {
                        outputLines[i] += fixSpace(charLines[i]) + ' ';
                    }
                }
            }

            const finalStr = outputLines.join('\n');
            console.log('%c' + finalStr, 'font-family: monospace; font-size:14px; white-space:pre; background:#fff; color:#000;');
            document.getElementById('asciiPreview').textContent = finalStr;
        }
