<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="google-adsense-account" content="ca-pub-8576294465310211"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8576294465310211" crossorigin="anonymous"></script><title>教程 - 小白爱分享</title><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/styles/github.min.css"><style>.tutorial-layout{max-width:90%;margin:0 auto;padding:20px;display:flex;gap:15px;min-height:calc(100vh - 80px);}.tutorial-nav{width:250px;background:white;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.05);border:1px solid #e2e8f0;overflow-y:auto;max-height:calc(100vh - 120px);position:sticky;top:80px;scrollbar-width:none;-ms-overflow-style:none;}.tutorial-nav::-webkit-scrollbar{width:8px;opacity:0;transition:opacity 0.3s;}.tutorial-nav:hover{scrollbar-width:thin;-ms-overflow-style:auto;}.tutorial-nav:hover::-webkit-scrollbar{opacity:1;}.tutorial-nav-header{padding:20px;background:#2d3748;color:white;border-radius:6px 6px 0 0;text-align:center;}.tutorial-nav-header h2{margin:0;font-size:1.3rem;}.tutorial-nav-list{list-style:none;padding:0;margin:0;}.tutorial-nav-item{border-bottom:1px solid #f0f0f0;}.tutorial-nav-item a{display:block;padding:12px 20px;color:#333;text-decoration:none;transition:all 0.3s;font-size:0.95rem;}.tutorial-nav-item a:hover{background-color:#ebf8ff;color:#4299e1;padding-left:25px;}.tutorial-nav-item.active a{background-color:#ebf8ff;color:#4299e1;font-weight:bold;border-left:4px solid #4299e1;}.tutorial-content{flex:1;background:white;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.05);border:1px solid #e2e8f0;overflow:hidden;display:flex;flex-direction:column;position:relative;}.tutorial-content-header{padding:20px;background:#edf2f7;border-bottom:2px solid #4299e1;}.tutorial-content-header h1{margin:0;color:#2d3748;font-size:1.8rem;}.tutorial-body{padding:30px;flex:1;overflow-y:auto;line-height:1.8;}.tutorial-nav::-webkit-scrollbar-track{background:#f1f1f1;}.tutorial-nav::-webkit-scrollbar-thumb{background:#a0aec0;border-radius:4px;}.tutorial-nav::-webkit-scrollbar-thumb:hover{background:#4a5568;}@media (max-width:768px){.tutorial-layout{flex-direction:column;padding:10px;}#tutorialNav{position:fixed;left:-100%;top:0;bottom:0;width:280px;z-index:999;overflow-y:auto;transition:left 0.3s ease;border-radius:0;max-height:none;border:none;box-shadow:2px 0 10px rgba(0,0,0,0.1);}#tutorialNav.active{left:0;}.tutorial-content{width:100%;margin-left:0;}.sidebar-toggle-btn{display:flex;}.sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:998;}.sidebar-overlay.active{display:block;}.tutorial-content-header h1{font-size:1.5rem;}.tutorial-body{padding:20px;}}</style></head><body><nav id="mainNav"></nav><button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button><div class="sidebar-overlay" id="sidebarOverlay"></div><div class="tutorial-layout"><div class="tutorial-nav" id="tutorialNav"><div class="tutorial-nav-header"><h2 id="navHeader">教程导航</h2></div><ul class="tutorial-nav-list" id="tutorialNavList"></ul></div><div class="tutorial-content"><div class="tutorial-content-header"><h1 id="currentTutorialTitle">正在加载...</h1></div><div id="tutorialContentBody" class="tutorial-body"></div></div></div><footer id="mainFooter"></footer><script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script><script src="https://cdn.jsdelivr.net/gh/highlightjs/cdn-release@11.9.0/build/highlight.min.js"></script><script src="../js/data.js"></script><script src="../js/main.js"></script><script type="module">let tutorialsData = [];async function init(){console.log('开始初始化教程页面...');const urlParams = new URLSearchParams(window.location.search);const id = urlParams.get('id');const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');const sidebarOverlay = document.getElementById('sidebarOverlay');const tutorialNav = document.getElementById('tutorialNav');function toggleSidebar(){if(tutorialNav){tutorialNav.classList.toggle('active');}if(sidebarToggleBtn){sidebarToggleBtn.classList.toggle('active');}if(sidebarOverlay){sidebarOverlay.classList.toggle('active');}}if(sidebarToggleBtn){sidebarToggleBtn.addEventListener('click',toggleSidebar);}if(sidebarOverlay){sidebarOverlay.addEventListener('click',toggleSidebar);}document.addEventListener('click',function(e){if(e.target.closest('.tutorial-nav-item')){if(window.innerWidth <= 768){toggleSidebar();}}});if(!id){console.error('未指定教程 ID');document.getElementById('currentTutorialTitle').textContent = '参数错误';document.getElementById('tutorialContentBody').innerHTML = '<p>请在链接中提供 id 参数，例如 tutorials.html?id=css</p>';return;}const navHeader = document.getElementById('navHeader');navHeader.textContent = id.toUpperCase()+ ' 教程导航';try{const dataPath = `../js/${id}TutorialsData.js`;console.log('尝试加载数据:',dataPath);const module = await import(dataPath);tutorialsData = module.default;if(!tutorialsData || !Array.isArray(tutorialsData)){throw new Error('无效的数据格式，期望数组导出');}tutorialsData.sort((a,b)=>(a.order ?? 999)-(b.order ?? 999));renderNav();const tutorialTitle = urlParams.get('title');if(tutorialTitle){const index = tutorialsData.findIndex(item => item.title === tutorialTitle);if(index !== -1){switchTutorial(index);}else{switchTutorial(0);}}else{switchTutorial(0);}}catch(error){console.error('加载教程数据失败:',error);document.getElementById('currentTutorialTitle').textContent = '数据加载失败';document.getElementById('tutorialContentBody').innerHTML = ` <p>无法加载 <strong>${id}</strong> 教程的数据。</p><p>错误详情:${error.message}</p><p>请确保 <code>xiaobaiaifenxiang/js/${id}TutorialsData.js</code> 文件存在且导出格式如下：</p><pre>const data = [{title:"标题",content:"内容"}];\nexport default data;</pre> `;}}function renderNav(){const navList = document.getElementById('tutorialNavList');navList.innerHTML = tutorialsData.map((item,index)=> ` <li class="tutorial-nav-item" data-index="${index}"><a href="javascript:void(0)" onclick="window.switchTutorial(${index})"> ${item.title}</a></li> `).join('');}window.switchTutorial = function(index){const item = tutorialsData[index];if(!item)return;document.querySelectorAll('.tutorial-nav-item').forEach((li,i)=>{if(i === index)li.classList.add('active');else li.classList.remove('active');});document.getElementById('currentTutorialTitle').textContent = item.title;const contentBody = document.getElementById('tutorialContentBody');if(typeof marked !== 'undefined'){contentBody.innerHTML = marked.parse(item.content || '');if(typeof hljs !== 'undefined'){contentBody.querySelectorAll('pre code').forEach((block)=>{hljs.highlightElement(block);});}}else{contentBody.innerHTML = item.content || '';}const url = new URL(window.location);url.searchParams.set('title',item.title);window.history.pushState({},'',url);document.querySelector('.tutorial-body').scrollTop = 0;};if(document.readyState === 'loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}</script></body></html>
