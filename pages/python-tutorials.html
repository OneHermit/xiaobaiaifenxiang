<!DOCTYPE html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Python教程 - 小白爱分享</title><link rel="stylesheet" href="../css/style.css"><meta name="google-adsense-account" content="ca-pub-8576294465310211"><script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-8576294465310211" crossorigin="anonymous"></script><style>.tutorial-layout{max-width:90%;margin:0 auto;padding:20px;display:flex;gap:15px;min-height:calc(100vh - 80px);}.tutorial-nav{width:250px;background:white;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.05);border:1px solid #e2e8f0;overflow-y:auto;max-height:calc(100vh - 120px);position:sticky;top:80px;scrollbar-width:none;-ms-overflow-style:none;}.tutorial-nav::-webkit-scrollbar{width:8px;opacity:0;transition:opacity 0.3s;}.tutorial-nav:hover{scrollbar-width:thin;-ms-overflow-style:auto;}.tutorial-nav:hover::-webkit-scrollbar{opacity:1;}.tutorial-nav-header{padding:20px;background:#2d3748;color:white;border-radius:6px 0 0 0;text-align:center;}.tutorial-nav-header h2{margin:0;font-size:1.3rem;}.tutorial-nav-header{border-radius:6px 6px 0 0;}.tutorial-nav-list{list-style:none;padding:0;margin:0;}.tutorial-nav-item{border-bottom:1px solid #f0f0f0;}.tutorial-nav-item a{display:block;padding:12px 20px;color:#333;text-decoration:none;transition:all 0.3s;font-size:0.95rem;}.tutorial-nav-item a:hover{background-color:#ebf8ff;color:#4299e1;padding-left:25px;}.tutorial-nav-item.active a{background-color:#ebf8ff;color:#4299e1;font-weight:bold;border-left:4px solid #4299e1;}.tutorial-content{flex:1;background:white;border-radius:6px;box-shadow:0 2px 8px rgba(0,0,0,0.05);border:1px solid #e2e8f0;overflow:hidden;position:relative;}.tutorial-content-header{padding:20px;background:#edf2f7;border-bottom:2px solid #4299e1;}.tutorial-content-header h1{margin:0;color:#2d3748;font-size:1.8rem;}.tutorial-iframe-container{width:100%;height:calc(100vh - 200px);overflow:hidden;}.tutorial-iframe{width:100%;height:100%;border:none;}.loading-message{text-align:center;padding:50px 20px;color:#4a5568;font-size:1.2rem;}.tutorial-nav::-webkit-scrollbar-track{background:#f1f1f1;}.tutorial-nav::-webkit-scrollbar-thumb{background:#a0aec0;border-radius:4px;}.tutorial-nav::-webkit-scrollbar-thumb:hover{background:#4a5568;}@media (max-width:768px){.tutorial-layout{flex-direction:column;padding:10px;}#tutorialNav{position:fixed;left:-100%;top:0;bottom:0;width:280px;z-index:999;overflow-y:auto;transition:left 0.3s ease;border-radius:0;max-height:none;border:none;box-shadow:2px 0 10px rgba(0,0,0,0.1);}#tutorialNav.active{left:0;}.tutorial-content{width:100%;margin-left:0;}.sidebar-toggle-btn{display:flex;}.sidebar-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:998;}.sidebar-overlay.active{display:block;}.tutorial-content-header h1{font-size:1.5rem;}.tutorial-iframe-container{height:calc(100vh - 250px);}}.tutorial-iframe-container{position:relative;}</style></head><body><nav id="mainNav"></nav><button class="sidebar-toggle-btn" id="sidebarToggleBtn" aria-label="Toggle sidebar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button><div class="sidebar-overlay" id="sidebarOverlay"></div><div class="tutorial-layout"><div class="tutorial-nav" id="tutorialNav"><div class="tutorial-nav-header"><h2>Python 教程导航</h2></div><ul class="tutorial-nav-list" id="tutorialNavList"></ul></div><div class="tutorial-content"><div class="tutorial-content-header"><h1 id="currentTutorialTitle">Python 基础教程</h1></div><div class="tutorial-iframe-container"><iframe id="tutorialFrame" class="tutorial-iframe" src="python/python-tutorial.html"></iframe></div></div></div><footer id="mainFooter"></footer><script src="../js/data.js"></script><script src="../js/main.js"></script><script type="module">import pyNavigation from '../js/pyNavigation.js';function init(){console.log('开始初始化页面...');try{if(typeof generateNavigation === 'function')generateNavigation();if(typeof generateFooter === 'function')generateFooter();const sidebarToggleBtn = document.getElementById('sidebarToggleBtn');const sidebarOverlay = document.getElementById('sidebarOverlay');const tutorialNav = document.getElementById('tutorialNav');function toggleSidebar(){if(tutorialNav){tutorialNav.classList.toggle('active');}if(sidebarToggleBtn){sidebarToggleBtn.classList.toggle('active');}if(sidebarOverlay){sidebarOverlay.classList.toggle('active');}}if(sidebarToggleBtn){sidebarToggleBtn.addEventListener('click',toggleSidebar);}if(sidebarOverlay){sidebarOverlay.addEventListener('click',toggleSidebar);}document.addEventListener('click',function(e){if(e.target.closest('.tutorial-nav-item')){if(window.innerWidth <= 768){toggleSidebar();}}});generateTutorialNav();const iframe = document.getElementById('tutorialFrame');if(iframe){iframe.onload = function(){console.log('iframe 加载完成');injectCodeStyles(iframe);updateActiveNavByIframeUrl(iframe);};const checkIframeLoaded =()=>{try{if(iframe.contentDocument && iframe.contentDocument.readyState === 'complete'){injectCodeStyles(iframe);updateActiveNavByIframeUrl(iframe);}}catch(e){console.log('无法直接访问 iframe 内容，等待 onload 事件');}};setTimeout(checkIframeLoaded,100);}const urlParams = new URLSearchParams(window.location.search);const tutorialUrl = urlParams.get('tutorial');if(tutorialUrl){loadTutorial(tutorialUrl);}}catch(error){console.error('初始化失败:',error);}}if(document.readyState === 'loading'){document.addEventListener('DOMContentLoaded',init);}else{init();}function generateTutorialNav(){const navList = document.getElementById('tutorialNavList');if(!navList)return;if(!pyNavigation || !Array.isArray(pyNavigation)){console.error('pyNavigation 数据加载失败');return;}let navHTML = '';pyNavigation.forEach((item,index)=>{const isActive = index === 0 ? 'active':'';navHTML += ` <li class="tutorial-nav-item ${isActive}" data-url="${item.url}"><a href="#" onclick="loadTutorialFromNav('${item.url}','${item.name}',event)"> ${item.name}</a></li> `;});navList.innerHTML = navHTML;}window.loadTutorialFromNav = function(url,title,event){if(event)event.preventDefault();document.querySelectorAll('.tutorial-nav-item').forEach(item =>{item.classList.remove('active');});const activeItem = document.querySelector(`[data-url="${url}"]`);if(activeItem){activeItem.classList.add('active');}const titleElem = document.getElementById('currentTutorialTitle');if(titleElem)titleElem.textContent = title;loadTutorial(url);const newUrl = new URL(window.location);newUrl.searchParams.set('tutorial',url);window.history.pushState({},'',newUrl);};function loadTutorial(url){const iframe = document.getElementById('tutorialFrame');if(iframe)iframe.src = url;}function updateActiveNavByIframeUrl(iframe){try{const iframeWindow = iframe.contentWindow;if(!iframeWindow)return;const iframePath = iframeWindow.location.pathname;const fileName = iframePath.split('/').pop();pyNavigation.forEach((item)=>{const itemFileName = item.url.split('/').pop();if(itemFileName === fileName){document.querySelectorAll('.tutorial-nav-item').forEach(navItem =>{navItem.classList.remove('active');});const activeItem = document.querySelector(`[data-url="${item.url}"]`);if(activeItem){activeItem.classList.add('active');const titleElem = document.getElementById('currentTutorialTitle');if(titleElem)titleElem.textContent = item.name;activeItem.scrollIntoView({behavior:'smooth',block:'nearest'});}}});}catch(error){console.log('无法访问 iframe URL:',error);}}function injectCodeStyles(iframe){try{const iframeDoc = iframe.contentDocument || iframe.contentWindow.document;if(!iframeDoc)return;const oldStyle = iframeDoc.getElementById('injected-code-highlight-style');if(oldStyle)oldStyle.remove();const style = iframeDoc.createElement('style');style.id = 'injected-code-highlight-style';style.textContent = ` .example_code,.hl-main{background:#f5f5f5 !important;background-color:#f5f5f5 !important;border-radius:6px !important;padding:15px !important;border:1px solid #ddd !important;line-height:1.6 !important;overflow-x:auto !important;}.example_code,.example_code *,.hl-main,.hl-main *{white-space:pre-wrap !important;word-wrap:break-word !important;font-family:'Consolas','Monaco','Courier New',monospace !important;font-size:14px !important;}pre{background:#e8f5e9 !important;padding:12px 15px !important;border:1px solid #a5d6a7 !important;white-space:pre-wrap !important;}.hl-comment{color:#008000 !important;font-style:italic !important;}.hl-identifier{color:#0000FF !important;font-weight:bold !important;}.hl-string,.hl-quotes{color:#A31515 !important;}.hl-number{color:#098658 !important;}.hl-reserved{color:#0000FF !important;font-weight:bold !important;}.hl-builtin{color:#795E26 !important;}.showbtn,a.showbtn,.tryitbtn,a.tryitbtn,[class*="showbtn"],[class*="tryitbtn"],.example a,.example_code + br + a{display:none !important;visibility:hidden !important;opacity:0 !important;pointer-events:none !important;height:0 !important;width:0 !important;margin:0 !important;padding:0 !important;position:absolute !important;}`;const head = iframeDoc.head || iframeDoc.getElementsByTagName('head')[0];if(head){head.appendChild(style);}else{iframeDoc.documentElement.appendChild(style);}interceptIframeLinks(iframeDoc);}catch(error){console.error('注入代码样式失败:',error);}}function interceptIframeLinks(iframeDoc){try{const links = iframeDoc.querySelectorAll('a');links.forEach(link =>{const href = link.getAttribute('href');if(href &&(href.startsWith('/python/')|| href.startsWith('python-')|| href.includes('.html'))){link.addEventListener('click',function(e){e.preventDefault();let targetUrl = href;if(href.startsWith('/python/')){targetUrl = 'python/' + href.split('/python/')[1];}else if(href.startsWith('python-')){targetUrl = 'python/' + href;}else if(href.includes('/python/')){const parts = href.split('/python/');targetUrl = 'python/' + parts[parts.length - 1];}const iframe = document.getElementById('tutorialFrame');if(iframe)iframe.src = targetUrl;});}});}catch(error){console.error('拦截链接失败:',error);}}</script></script></body></html>
